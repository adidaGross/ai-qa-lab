# GitHub Actions: runs automatically on GitHub's servers on every push and pull request.
# Free and without AI. It runs on Linux, macOS AND Windows, to prove the project works on all three:
#   1. "npm run setup", exactly what a new user runs (timed, see the run's Summary page)
#   2. typecheck (the AI layer comes from the private Faultwise package)
#   3. the healed tests (they must all pass)
# (The AI flow runs only in the "Publish site" workflow, see pages.yml.)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false # finish all three systems even if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The AI layer is the private Faultwise package. A read-only deploy key (secret AI_QA_DEPLOY_KEY)
      # lets npm download it; it can read that one repository and nothing else.
      - name: Access the private Faultwise package
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AI_QA_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ai_qa
          chmod 600 ~/.ssh/ai_qa
          git config --global core.sshCommand "ssh -i ~/.ssh/ai_qa -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git config --global url."ssh://git@github.com/faultwise/faultwise.git".insteadOf "https://github.com/faultwise/faultwise.git"

      # Same command a new user runs. No npm cache on purpose, so the time is a real first install.
      # Includes: install packages, download Chromium, run the 37 tests, check the expected-failure baseline.
      - name: npm run setup (timed)
        run: npm run setup -- --ci

      - name: Typecheck
        run: npx tsc

      - name: Run healed tests (must all pass)
        run: npm run test:healed

      - name: Upload reports and setup timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: reports/
          retention-days: 14
